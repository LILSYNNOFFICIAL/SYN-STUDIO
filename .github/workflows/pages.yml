name: Deploy SYN Studio to GitHub Pages
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Install Dioxus CLI 0.7.10
        run: cargo install dioxus-cli --version 0.7.10 --locked
      - name: Build web application
        run: dx bundle --release --out-dir build
      - name: Assemble Pages site
        run: |
          rm -rf studio/*
          cp -R build/public/. studio/
          python3 - <<'PY'
          from pathlib import Path
          p = Path("studio/index.html")
          s = p.read_text()
          lines = [
              line for line in s.splitlines()
              if '<meta http-equiv="refresh"' not in line
              and 'navigator.serviceWorker.register' not in line
          ]
          s = "\n".join(lines).rstrip() + '\n'
          s += '<script>if ("serviceWorker" in navigator) navigator.serviceWorker.register("../sw.js", { updateViaCache: "none" }).catch(() => {});</script>\n'
          p.write_text(s)
          Path("studio/404.html").write_text(s)
          Path("index.html").write_text('''<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="refresh" content="0; url=/SYN-STUDIO/studio/">
  <title>SYN Studio</title>
</head>
<body>
  <p>Opening <a href="/SYN-STUDIO/studio/">SYN Studio</a>…</p>
</body>
</html>
''')
          PY
      - name: Verify assembled Pages site
        run: |
          test -f index.html
          test -f studio/index.html
          test -f studio/404.html
          test -d studio/assets
          test -s studio/index.html
          ! grep -q 'url=/SYN-STUDIO/studio/' studio/index.html
          ! grep -q '<meta http-equiv="refresh"' studio/index.html
          ! grep -q 'url=./studio/' studio/index.html
          grep -q 'id="main"' studio/index.html
          grep -q '/SYN-STUDIO/studio/assets/' studio/index.html
          grep -q 'navigator.serviceWorker.register("../sw.js"' studio/index.html
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4
