name: Deploy SYN Studio (Iced)
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
      - name: Install wasm-bindgen CLI
        run: cargo install wasm-bindgen-cli --version 0.2.126 --locked
      - name: Check native Rust
        run: cargo check
      - name: Build WASM
        run: cargo build --release --target wasm32-unknown-unknown
      - name: Generate web bindings
        run: |
          mkdir -p studio/pkg
          wasm-bindgen target/wasm32-unknown-unknown/release/syn-studio.wasm --target web --out-dir studio/pkg
      - name: Create Pages entrypoint
        run: |
          cat > studio/index.html <<'EOF'
          <!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
            <meta name="theme-color" content="#07090d">
            <title>SYN Studio</title>
            <style>
              html,body { margin:0; width:100%; height:100%; overflow:hidden; background:#07090d; }
              body { touch-action:none; font-family:system-ui,sans-serif; }
              canvas { width:100vw!important; height:100vh!important; display:block; }
            </style>
          </head>
          <body>
            <script type="module">
              import init from "./pkg/syn-studio.js";
              init("./pkg/syn-studio_bg.wasm");
            </script>
          </body>
          </html>
          EOF
          cat > index.html <<'EOF'
          <!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="refresh" content="0; url=/SYN-STUDIO/studio/"><title>SYN Studio</title></head><body><a href="/SYN-STUDIO/studio/">Open SYN Studio</a></body></html>
          EOF
          cp studio/index.html studio/404.html
      - name: Verify Pages artifact
        run: |
          test -s studio/index.html
          test -s studio/pkg/syn-studio.js
          test -s studio/pkg/syn-studio_bg.wasm
          test -s studio/404.html
          test -s index.html
          grep -q 'pkg/syn-studio.js' studio/index.html
          grep -q 'SYN-STUDIO/studio/' index.html
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4
