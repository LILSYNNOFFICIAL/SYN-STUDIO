name: Deploy SYN Studio to GitHub Pages
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - uses: ealmloff/dioxus-ci/actions/setup-dioxus@main
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
      - uses: ealmloff/dioxus-ci/actions/install-dioxus-cli@main
        with:
          version: 0.7.10
      - name: Build web application
        run: dx bundle --release --out-dir build
      - name: Assemble Pages site
        run: |
          rm -rf studio/*
          cp -R build/public/. studio/
          cp studio/index.html studio/404.html
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4