name: Deploy SYN Studio (Hybrid Rust/WASM + Browser UI)
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Check and test Rust engine
        run: cargo test
      - name: Build WASM engine
        run: cargo build --release --target wasm32-unknown-unknown
      - name: Generate browser bindings
        run: |
          cargo install wasm-bindgen-cli --version 0.2.129 --locked
          rm -rf studio/pkg
          mkdir -p studio/pkg
          wasm-bindgen target/wasm32-unknown-unknown/release/syn_studio.wasm --target web --out-dir studio/pkg
      - name: Verify hybrid architecture
        run: |
          test -s studio/index.html
          test -s studio/app.js
          test -s studio/styles.css
          test -s studio/pkg/syn-studio.js
          test -s studio/pkg/syn-studio_bg.wasm
          ! grep -E 'iced|dioxus' Cargo.toml src/lib.rs studio/index.html studio/app.js studio/styles.css
      - name: Create Pages entrypoint
        run: |
          cat > index.html <<'EOF'
          <!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="refresh" content="0; url=/SYN-STUDIO/studio/"><title>SYN Studio</title></head><body><a href="/SYN-STUDIO/studio/">Open SYN Studio</a></body></html>
          EOF
          cp studio/index.html studio/404.html
      - name: Stage Pages site
        run: |
          rm -rf _site
          mkdir -p _site
          cp index.html _site/index.html
          cp manifest.webmanifest _site/manifest.webmanifest
          cp sw.js _site/sw.js
          cp -R studio _site/studio
      - name: Verify Pages artifact
        run: |
          test -s _site/index.html
          test -s _site/manifest.webmanifest
          test -s _site/sw.js
          test -s _site/studio/index.html
          test -s _site/studio/app.js
          test -s _site/studio/styles.css
          test -s _site/studio/pkg/syn-studio.js
          test -s _site/studio/pkg/syn-studio_bg.wasm
          test -s _site/studio/404.html
          test ! -e _site/src
          test ! -e _site/target
          test ! -e _site/.git
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4
