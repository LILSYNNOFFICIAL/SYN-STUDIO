name: Rust Build
on:
  push:
    branches: ["main"]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
      - name: Native Rust check
        run: cargo check
      - name: Native tests
        run: cargo test
      - name: WASM check
        run: cargo check --target wasm32-unknown-unknown
