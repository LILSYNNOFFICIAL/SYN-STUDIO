name: Rust Build
on:
  push:
    branches: ["main"]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Native tests
        run: cargo test
      - name: WASM check
        run: cargo check --target wasm32-unknown-unknown
      - name: Verify framework removal
        run: |
          ! grep -R -E 'iced|dioxus' Cargo.toml src studio --include='*.rs' --include='*.js' --include='*.html' --include='*.css'
