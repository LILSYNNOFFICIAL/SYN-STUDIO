[package]
name = "syn-studio"
version = "0.8.0"
edition = "2021"

[dependencies]
dioxus = { version = "0.7.10", features = ["web"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "js"] }
web-sys = { version = "0.3", features = ["Window", "Storage"] }

[profile.release]
lto = "thin"
codegen-units = 1
opt-level = 3
