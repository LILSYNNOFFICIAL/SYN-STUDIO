[package]
name = "syn-studio"
version = "0.5.0"
edition = "2021"

[dependencies]
iced = { version = "0.14", features = ["canvas", "highlighter", "image", "svg", "webgl", "tokio"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "js"] }
wasm-bindgen = "0.2"
js-sys = "0.3"
console_error_panic_hook = "0.1"
console_log = "1"
log = "0.4"
web-sys = { version = "0.3", features = ["Window", "Storage"] }


[profile.release]
lto = "thin"
codegen-units = 1
opt-level = 3
