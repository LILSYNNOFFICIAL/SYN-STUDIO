[package]
name="syn-studio"
version="0.4.0"
edition="2021"

[dependencies]
dioxus={version="0.7.10",default-features=false,features=["html","signals","macro","hooks","asset","document","launch"]}
serde={version="1",features=["derive"]}
serde_json="1"
uuid={version="1",features=["v4","js"]}
base64="0.22"
dioxus-code-editor="0.1.2"
dioxus-code={version="0.1.2",default-features=false,features=["runtime","lang-json","lang-css","lang-html","lang-javascript","lang-typescript","lang-markdown"]}
wasm-bindgen={version="0.2",optional=true}
web-sys={version="0.3",optional=true,features=["Window","Document","Storage","Blob","Url","HtmlAnchorElement","Location"]}
js-sys={version="0.3",optional=true}

[features]
default=["web"]
web=["dioxus/web","dep:wasm-bindgen","dep:web-sys","dep:js-sys"]