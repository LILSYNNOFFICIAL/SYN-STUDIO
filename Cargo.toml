[package]
name = "syn-studio"
version = "0.9.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "js"] }
wasm-bindgen = "0.2.129"

[profile.release]
lto = "thin"
codegen-units = 1
opt-level = 3
