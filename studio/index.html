<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07090e"><meta name="description" content="SYN Studio, hybrid Rust/WASM creative authoring environment."><title>SYN Studio</title><link rel="stylesheet" href="./styles.css"></head><body><div id="app"><header class="chrome"><div class="titlebar"><button class="brand" id="brand"><span class="brand-mark">S</span><span><b>SYN Studio</b><small id="docTitle">Creative Systems</small></span></button><div class="quick-actions"><button data-action="undo">↶</button><button data-action="redo">↷</button><span class="save-state"><i></i><span id="saveState">Saved</span></span><button class="ghost" data-action="save">Save</button><button class="primary" data-action="preview">Preview</button></div></div><nav class="menubar" id="menubar"></nav><div id="menuPopup" class="menu-popup" hidden></div></header><main class="workspace"><aside class="toolrail glass"><div class="rail-group"><small>CREATE</small><button class="tool active" data-tool="select"><span>↖</span><em>Select</em></button><button class="tool" data-tool="text"><span>T</span><em>Text</em></button><button class="tool" data-tool="shape"><span>◇</span><em>Shape</em></button><button class="tool" data-tool="button"><span>▣</span><em>Button</em></button><button class="tool" data-tool="media"><span>▧</span><em>Media</em></button></div><div class="rail-group"><small>WORK</small><button class="tool" data-surface="motion"><span>◌</span><em>Motion</em></button><button class="tool" data-surface="code"><span>{ }</span><em>Code</em></button><button class="tool" data-surface="media"><span>◈</span><em>Assets</em></button></div><div class="rail-spacer"></div><button class="tool ai" data-action="commands"><span>✦</span><em>Command</em></button></aside><section class="center"><div class="contextbar glass"><div class="context-title"><span class="live-dot"></span><div><b id="sceneName">Command Center</b><small id="contextSub">Design · 1200 × 720</small></div></div><div class="context-tools"><div class="segmented"><button class="active" data-surface="design">Design</button><button data-surface="motion">Motion</button><button data-surface="code">Code</button></div><button data-action="zoomOut">−</button><button id="zoomValue">100%</button><button data-action="zoomIn">+</button><button data-action="fit">Fit</button><button data-action="inspector">Inspector</button></div></div><div class="canvas-wrap"><div class="canvas-hud top"><span class="pill" id="modePill">DESIGN</span><span id="canvasHint">Select an object · Double-click text to edit</span></div><div id="stageViewport" class="stage-viewport"><div id="stageScale" class="stage-scale"><svg id="stage" viewBox="0 0 1200 720" preserveAspectRatio="xMidYMid meet"></svg></div></div><div class="canvas-hud bottom"><span id="canvasStatus">Rust/WASM engine ready</span><span>•</span><span id="objectCount">0 objects</span><span>•</span><span id="sceneCount">1 scene</span></div></div><section class="scenes glass"><div class="scenes-head"><span>SCENES</span><button data-action="addScene">＋</button></div><div id="sceneStrip" class="scene-strip"></div></section></section><aside id="inspector" class="inspector glass"><div class="inspector-head"><div><small>INSPECTOR</small><b id="selectionName">No selection</b></div><button data-action="inspector">×</button></div><div id="inspectorBody" class="inspector-body"></div></aside></main><section id="timeline" class="timeline glass"><div class="timeline-head"><div><small>MOTION</small><b>Timeline</b></div><div class="transport"><button data-action="stop">■</button><button class="play" data-action="play">▶</button><span id="timeReadout">00:00.00</span></div><div class="timeline-actions"><button data-action="keyframe">◆ Keyframe</button><button data-action="toggleTimeline">⌃</button></div></div><div class="timeline-body"><div class="ruler"><span>0s</span><span>2s</span><span>4s</span><span>6s</span><span>8s</span></div><div id="tracks" class="tracks"></div><input id="playhead" class="playhead" type="range" min="0" max="8" step=".01" value="0"></div></section><div id="commandPalette" class="overlay" hidden><div class="palette glass"><input id="commandSearch" placeholder="Search commands…"><div id="commandResults"></div></div></div><div id="toast" class="toast"></div><input id="fileOpen" type="file" accept=".syn,.json,application/json" hidden><input id="mediaOpen" type="file" accept="image/*,video/*" multiple hidden></div><script type="module" src="./app.js"></script></body></html>
